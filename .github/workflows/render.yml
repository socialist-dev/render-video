name: Youtube Video Render v2
on:
  repository_dispatch:
    types: [render_video]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: 1. Setup Tools & Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          npm install puppeteer
          sudo npx puppeteer browsers install chrome --install-deps

      - name: 2. Render UI & Get Coords
        run: node render_ui.js "${{ github.event.client_payload.title }}"

      - name: 3. Download Instagram Video
        run: yt-dlp "${{ github.event.client_payload.instagram_url }}" -o "cat.mp4" --no-check-certificate

      - name: 4. Final Render (FFmpeg)
        run: |
          COORDS=$(cat coords.txt)
          X=$(echo $COORDS | cut -d: -f1)
          Y=$(echo $COORDS | cut -d: -f2)
          W=$(echo $COORDS | cut -d: -f3)
          H=$(echo $COORDS | cut -d: -f4)

          ffmpeg -i cat.mp4 -i cover.png -filter_complex \
          "[1:v]colorkey=0xFF0000:0.1:0.1[ui_mask]; \
           [0:v]scale=$W:$H:force_original_aspect_ratio=increase,crop=$W:$H,pad=1080:1920:$X:$Y:color=white[v_bg]; \
           [v_bg][ui_mask]overlay=0:0" -c:v libx264 -pix_fmt yuv420p -preset fast -c:a copy output.mp4

      # Option 1
      # - name: 5. Send Video to Telegram
      #   run: |
      #     curl -v -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
      #     -F "video=@output.mp4" \
      #     -F "caption=✅ Render thành công!%0A📌 Tiêu đề: ${{ github.event.client_payload.title }}" \
      #     https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendVideo

      # Option 2
      # In step "5. Upload Video and Save to Google Sheets", replace lines 50-60 with:
      - name: 5. Upload Video and Save to Google Sheets
        run: |
          # 1. Upload video lên file.io (Rất ổn định cho GitHub Actions)
          # Dịch vụ này trả về JSON, chúng ta dùng Python để lấy link sạch
          RESPONSE=$(curl -s -F "file=@output.mp4" https://file.io)
          DOWNLOAD_URL=$(python3 -c "import json, sys; print(json.loads('''$RESPONSE''').get('link', 'ERROR'))")
          
          # Kiểm tra nếu upload lỗi
          if [ "$DOWNLOAD_URL" == "ERROR" ] || [ -z "$DOWNLOAD_URL" ]; then
            echo "❌ Upload failed! Response from server:"
            echo "$RESPONSE"
            exit 1
          fi
          
          echo "✅ Link download: $DOWNLOAD_URL"
      
          # 2. Xử lý mã hóa tiêu đề và URL (URL Encode)
          TITLE_RAW="${{ github.event.client_payload.title }}"
          TITLE_ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('''$TITLE_RAW'''))")
          URL_ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('''$DOWNLOAD_URL'''))")
      
          # 3. Gửi dữ liệu về Google Sheets qua Apps Script
          curl -f -L "https://script.google.com/macros/s/AKfycbxKtdzArCSoJom9rVoozQYmEAgZrK1eeEb0QEPP0VFlZzr8cUOEr0dNwoAMiErniJ_9/exec?title=$TITLE_ENCODED&url=$URL_ENCODED"
