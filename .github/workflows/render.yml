name: Youtube Video Render Engine
on:
  repository_dispatch:
    types: [render_video]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          npm install puppeteer
          # QUAN TRỌNG: Lệnh này sẽ cài đặt Chrome và mọi thư viện hệ thống (so) còn thiếu
          npx puppeteer browsers install chrome --install-deps

      - name: 1. Render UI & Get Coords
        run: node render_ui.js "${{ github.event.client_payload.title }}"

      - name: 2. Download Video
        run: yt-dlp "${{ github.event.client_payload.instagram_url }}" -o "cat.mp4"

      - name: 3. Final Render (FFmpeg)
        run: |
          COORDS=$(cat coords.txt)
          X=$(echo $COORDS | cut -d: -f1)
          Y=$(echo $COORDS | cut -d: -f2)
          W=$(echo $COORDS | cut -d: -f3)
          H=$(echo $COORDS | cut -d: -f4)

          ffmpeg -i cat.mp4 -i cover.png -filter_complex \
          "[1:v]colorkey=0xFF0000:0.1:0.1[ui_mask]; \
           [0:v]scale=$W:$H:force_original_aspect_ratio=increase,crop=$W:$H,pad=1080:1920:$X:$Y:color=white[v_bg]; \
           [v_bg][ui_mask]overlay=0:0" -c:v libx264 -pix_fmt yuv420p -preset fast -c:a copy output.mp4

      - name: 4. Gửi video về n8n
        run: |
          curl -v -X POST "${{ github.event.client_payload.resume_url }}" \
          -H "X-N8N-TOKEN: ${{ secrets.N8N_WAIT_TOKEN }}" \
          -F "data=@output.mp4"
