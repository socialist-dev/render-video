name: Youtube Video Render v2
on:
  repository_dispatch:
    types: [render_video]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: 1. Setup Tools & Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          npm install puppeteer
          sudo npx puppeteer browsers install chrome --install-deps

      - name: 2. Render UI & Get Coords
        run: node render_ui.js "${{ github.event.client_payload.title }}"

      - name: 3. Download Instagram Video
        run: yt-dlp "${{ github.event.client_payload.instagram_url }}" -o "cat.mp4" --no-check-certificate

      - name: 4. Final Render (FFmpeg)
        run: |
          COORDS=$(cat coords.txt)
          X=$(echo $COORDS | cut -d: -f1)
          Y=$(echo $COORDS | cut -d: -f2)
          W=$(echo $COORDS | cut -d: -f3)
          H=$(echo $COORDS | cut -d: -f4)

          ffmpeg -i cat.mp4 -i cover.png -filter_complex \
          "[1:v]colorkey=0xFF0000:0.1:0.1[ui_mask]; \
           [0:v]scale=$W:$H:force_original_aspect_ratio=increase,crop=$W:$H,pad=1080:1920:$X:$Y:color=white[v_bg]; \
           [v_bg][ui_mask]overlay=0:0" -c:v libx264 -pix_fmt yuv420p -preset fast -c:a copy output.mp4

      # Option 1
      # - name: 5. Send Video to Telegram
      #   run: |
      #     curl -v -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
      #     -F "video=@output.mp4" \
      #     -F "caption=✅ Render thành công!%0A📌 Tiêu đề: ${{ github.event.client_payload.title }}" \
      #     https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendVideo

      # Option 2
      # In step "5. Upload Video and Save to Google Sheets", replace lines 50-60 with:
      - name: 5. Upload Video to GoFile and Save to Sheets
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
          TITLE: ${{ github.event.client_payload.title }}
          GS_URL: "https://script.google.com/macros/s/AKfycbxKtdzArCSoJom9rVoozQYmEAgZrK1eeEb0QEPP0VFlZzr8cUOEr0dNwoAMiErniJ_9/exec"
        run: |
          python3 -c "
          import requests, os, urllib.parse, sys
          
          def run():
              try:
                  headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'}
                  
                  # 1. Lấy server rảnh
                  print('--- Fetching GoFile Server ---')
                  r_server = requests.get('https://api.gofile.io/getServer', headers=headers)
                  if r_server.status_code != 200:
                      print(f'Error fetching server: {r_server.text}')
                      sys.exit(1)
                  
                  server = r_server.json()['data']['server']
                  print(f'✅ Using Server: {server}')
          
                  # 2. Upload video
                  print('--- Uploading Video ---')
                  with open('output.mp4', 'rb') as f:
                      files = {'file': f}
                      # Gửi token nếu có, nếu không GoFile sẽ tự tạo Guest account
                      data = {'token': os.environ.get('GOFILE_TOKEN')}
                      r_upload = requests.post(f'https://{server}.gofile.io/uploadFile', files=files, data=data, headers=headers)
                  
                  if r_upload.status_code != 200:
                      print(f'Upload failed: {r_upload.text}')
                      sys.exit(1)
                  
                  download_url = r_upload.json()['data']['downloadPage']
                  print(f'✅ Download Link: {download_url}')
          
                  # 3. Gửi sang Google Sheets
                  print('--- Sending to Google Sheets ---')
                  title_enc = urllib.parse.quote(os.environ.get('TITLE', 'No Title'))
                  url_enc = urllib.parse.quote(download_url)
                  
                  final_gs_url = f'{os.environ["GS_URL"]}?title={title_enc}&url={url_enc}'
                  r_gs = requests.get(final_gs_url, allow_redirects=True)
                  print(f'✅ Google Sheets response: {r_gs.text}')
                  
              except Exception as e:
                  print(f'❌ CRITICAL ERROR: {str(e)}')
                  sys.exit(1)
          
          run()
          "
